  <script type="text/babel">
    const { useState, useMemo, useEffect } = React;

    const COLORS = ["#FF6B6B","#4ECDC4","#45B7D1","#96CEB4","#FFEAA7","#DDA0DD","#98D8C8","#F7DC6F","#BB8FCE","#85C1E9"];
    const STATUS_CFG = {

    const ROW_H = 44, BAR_TOP = 10, BAR_H = 24, CELL_W = 32;
    const LABEL_W = window.innerWidth <= 640 ? 110 : 220;

    const INIT = [
      {"name":"転入届提出","startDate":"2026-05-08","endDate":"2026-05-08","status":"todo","color":"#45B7D1","assignee":"","parentId":null,"deps":[1777969681746],"id":1777969704931},
      {"name":"読書イベント","startDate":"2026-05-15","endDate":"2026-05-15","status":"todo","color":"#96CEB4","assignee":"濵野","parentId":null,"deps":[1778043940942],"id":1778043835412},
      {"name":"1週間前SNS告知","startDate":"2026-05-08","endDate":"2026-05-08","status":"todo","color":"#96CEB4","assignee":"濵野","parentId":1778043835412,"deps":[],"id":1778043901335},
      {"name":"前日SNS告知","startDate":"2026-05-14","endDate":"2026-05-14","status":"todo","color":"#96CEB4","assignee":"濵野","parentId":1778043835412,"deps":[1778043901335],"id":1778043940942},
      {"name":"Canva講座","startDate":"2026-05-21","endDate":"2026-05-21","status":"todo","color":"#DDA0DD","assignee":"濵野","parentId":null,"deps":[1778044134817,1778044074520],"id":1778044029369},
      {"name":"1週間前SNS告知","startDate":"2026-05-14","endDate":"2026-05-14","status":"todo","color":"#DDA0DD","assignee":"","parentId":1778044029369,"deps":[],"id":1778044055728},
      {"name":"前日SNS告知","startDate":"2026-05-20","endDate":"2026-05-20","status":"todo","color":"#DDA0DD","assignee":"","parentId":1778044029369,"deps":[1778044055728],"id":1778044074520},
      {"name":"事前素材準備","startDate":"2026-05-19","endDate":"2026-05-20","status":"todo","color":"#DDA0DD","assignee":"","parentId":1778044029369,"deps":[1778044055728],"id":1778044134817},
      {"name":"【イベ】ボドゲ","startDate":"2026-05-23","endDate":"2026-05-23","status":"todo","color":"#BB8FCE","assignee":"","parentId":null,"deps":[1778044325992,1778044222998],"id":1778044193652},
      {"name":"1週間前SNS告知","startDate":"2026-05-16","endDate":"2026-05-16","status":"todo","color":"#BB8FCE","assignee":"","parentId":1778044193652,"deps":[],"id":1778044208202},
      {"name":"前日SNS告知","startDate":"2026-05-22","endDate":"2026-05-22","status":"todo","color":"#BB8FCE","assignee":"","parentId":1778044193652,"deps":[1778044208202],"id":1778044222998},

      {"name":"【イベ】ふたばMTG","startDate":"2026-05-28","endDate":"2026-05-28","status":"todo","color":"#85C1E9","assignee":"","parentId":null,"deps":[1778044538455,1778044657074],"id":1778044463465},
      {"name":"1週間前SNS告知","startDate":"2026-05-21","endDate":"2026-05-21","status":"todo","color":"#85C1E9","assignee":"","parentId":1778044463465,"deps":[],"id":1778044508722},
      {"name":"前日SNS告知","startDate":"2026-05-27","endDate":"2026-05-27","status":"todo","color":"#85C1E9","assignee":"","parentId":1778044463465,"deps":[1778044508722],"id":1778044538455},
      {"name":"内容の検討","startDate":"2026-05-19","endDate":"2026-05-25","status":"todo","color":"#85C1E9","assignee":"","parentId":1778044463465,"deps":[],"id":1778044583207},
      {"name":"イベシミュレーション","startDate":"2026-05-26","endDate":"2026-05-27","status":"todo","color":"#85C1E9","assignee":"","parentId":1778044463465,"deps":[1778044583207],"id":1778044657074},
      {"name":"【イベ】あみ会","startDate":"2026-05-31","endDate":"2026-05-31","status":"todo","color":"#FF6B6B","assignee":"","parentId":null,"deps":[1778044785896],"id":1778044735956},
      {"name":"1週間前SNS告知","startDate":"2026-05-24","endDate":"2026-05-24","status":"todo","color":"#FF6B6B","assignee":"","parentId":1778044735956,"deps":[],"id":1778044764163},
      {"name":"前日SNS告知","startDate":"2026-05-30","endDate":"2026-05-30","status":"todo","color":"#FF6B6B","assignee":"","parentId":1778044735956,"deps":[1778044764163],"id":1778044785896},
      {"name":"前の家の鍵返却","startDate":"2026-05-08","endDate":"2026-05-08","status":"todo","color":"#4ECDC4","assignee":"","parentId":null,"deps":[1778044979993],"id":1778044937414},
      {"name":"掃除","startDate":"2026-05-07","endDate":"2026-05-07","status":"todo","color":"#4ECDC4","assignee":"","parentId":1778044937414,"deps":[],"id":1778044979993},
      {"name":"郵便局に転送手続き","startDate":"2026-05-08","endDate":"2026-05-08","status":"todo","color":"#45B7D1","assignee":"","parentId":1777969704931,"deps":[],"id":1778045022972},
    ];

    const STORAGE_KEY = "ganttask_v1";

    // その日が属する週の月曜日を返す
    const getWeekKey = (d) => {
      const date = new Date(d);
      const day = date.getDay();
      const diff = day === 0 ? -6 : 1 - day;
      const mon = new Date(date);
      mon.setDate(date.getDate() + diff);
      return toStr(mon);
    };

    function SyncIndicator() {
      const [status, setStatus] = React.useState("local"); // local | syncing | synced | error
      React.useEffect(()=>{
        const onReady = () => setStatus("synced");
        if(window._firestore) setStatus("synced");
        else window.addEventListener("firebase-ready", onReady, {once:true});
        return ()=>window.removeEventListener("firebase-ready", onReady);
      },[]);
      const cfg = {
        local:   { color:"#6B7280", dot:"#6B7280", label:"ローカル保存" },
        synced:  { color:"#10B981", dot:"#10B981", label:"クラウド同期中" },
        error:   { color:"#EF4444", dot:"#EF4444", label:"同期エラー" },
      }[status] || { color:"#F59E0B", dot:"#F59E0B", label:"接続中..." };
      return (
        <div style={{ fontSize:10, color:cfg.color, display:"flex", alignItems:"center", gap:4 }} title={cfg.label}>
          <svg width="8" height="8" viewBox="0 0 8 8"><circle cx="4" cy="4" r="3.5" fill={cfg.dot} opacity="0.9"/></svg>
          <span className="mobile-hide">{cfg.label}</span>
        </div>
      );
    }

    // マウス追従ツールチップ
    function BarTooltip({ name }) {
      const [pos, setPos] = React.useState(null);
      return (
        <div
          onMouseMove={e=>setPos({x:e.clientX, y:e.clientY})}
          onMouseLeave={()=>setPos(null)}
          style={{ position:"absolute", inset:0, zIndex:10 }}
        >
          {pos && (
            <div style={{
              position:"fixed", left:pos.x+12, top:pos.y-32,
              background:"#1E1E2E", border:"1px solid #3A3A5A", color:"#E2E8F0",
              fontSize:11, padding:"4px 9px", borderRadius:6, whiteSpace:"nowrap",
              pointerEvents:"none", zIndex:9999, boxShadow:"0 4px 16px rgba(0,0,0,0.6)"
            }}>
              {name}
            </div>
          )}
        </div>
      );
    }
    const toStr = d => d.toISOString().split("T")[0];
    const daysBetween = (d1,d2) => Math.round((new Date(d2)-new Date(d1))/86400000);
    const fmtDate = s => { const d=new Date(s); return `${d.getMonth()+1}/${d.getDate()}`; };
    function getDays(s,e){ const days=[],cur=new Date(s),end=new Date(e); while(cur<=end){days.push(new Date(cur));cur.setDate(cur.getDate()+1);} return days; }

    function buildRows(tasks, collapsed) {
      const rows = [], childMap = {};
      tasks.filter(t=>t.parentId).forEach(t=>{ if(!childMap[t.parentId])childMap[t.parentId]=[]; childMap[t.parentId].push(t); });
      for(const t of tasks.filter(t=>!t.parentId)){
        const hasChildren = !!(childMap[t.id]?.length);
        rows.push({...t, depth:0, hasChildren});
        if(hasChildren && !collapsed[t.id]) for(const c of childMap[t.id]||[]) rows.push({...c, depth:1, hasChildren:false});
      }
      return rows;
    }

    function loadTasks() {
      try { const s = localStorage.getItem(STORAGE_KEY); return s ? JSON.parse(s) : INIT; } catch { return INIT; }
    }

    // Firebase書き込み（throttle: 1秒）
    let _fbTimer = null;
    function saveTasks(tasks) {
      // localStorageには即時保存
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks)); } catch {}
      // Firestoreには1秒throttle
      if(!window._firestore) return;
      clearTimeout(_fbTimer);
      _fbTimer = setTimeout(()=>{
        const { docRef } = window._firestore;
        docRef.set({ tasks: JSON.stringify(tasks) }).catch(()=>{});
      }, 1000);
    }

    function App() {
      const [tasks, setTasksRaw] = useState(loadTasks);
      const [collapsed, setCollapsed] = useState({});
      const isMobile = window.innerWidth <= 640;
      const [view, setView] = useState(isMobile ? "gantt" : "split");
      const [showModal, setShowModal] = useState(false);
      const [editId, setEditId] = useState(null);
      const [filters, setFilters] = useState(new Set());
      const today = toStr(new Date());

      // Auto-save to localStorage + Firestore
      const setTasks = (fn) => {
        setTasksRaw(prev => {
          const next = typeof fn === "function" ? fn(prev) : fn;
          saveTasks(next);
          return next;
        });
      };

      const emptyForm = (parentId=null) => {
        const parent = parentId ? tasks.find(t=>t.id===parentId) : null;
        return { name:"", startDate:parent?parent.startDate:today, endDate:parent?parent.endDate:today,
          status:"todo", color:parent?parent.color:COLORS[Math.floor(Math.random()*COLORS.length)], assignee:"", parentId, deps:[], weight:3 };
      };
      const [form, setForm] = useState(emptyForm());

      const ganttRef = React.useRef(null);
      const listRef  = React.useRef(null);
      const syncingRef = React.useRef(false);

      const onListScroll = React.useCallback(()=>{
        if(syncingRef.current || !ganttRef.current || !listRef.current) return;
        syncingRef.current = true;
        ganttRef.current.scrollTop = listRef.current.scrollTop;
        syncingRef.current = false;
      },[]);
      const onGanttScroll = React.useCallback(()=>{
        if(syncingRef.current || !ganttRef.current || !listRef.current) return;
        syncingRef.current = true;
        listRef.current.scrollTop = ganttRef.current.scrollTop;
        syncingRef.current = false;
      },[]);

      const [flashingIds, setFlashingIds] = React.useState(new Set());
      const [sinkingIds,  setSinkingIds]  = React.useState(new Set());
      const [drawerOpen,  setDrawerOpen]  = React.useState(false);

      // flatRowsを先に計算してallDatesの基準にする
      // フラッシュ中のタスクはフィルターがかかっていても除外しない
      const flatRows = useMemo(()=>{
        const all = buildRows(tasks, collapsed);
        if(filters.size===0) return all;
        return all.filter(t=>filters.has(t.status) || flashingIds.has(t.id));
      },[tasks,collapsed,filters,flashingIds]);

      // 表示中のタスク（flatRows）を基準に日付範囲を決定
      const allDates = useMemo(()=>{
        const visible = flatRows.length ? flatRows : tasks;
        if(!visible.length) return [];
        const base = visible[0].startDate;
        const mn = visible.reduce((m,t)=>t.startDate<m?t.startDate:m, base);
        const mx = visible.reduce((m,t)=>t.endDate>m?t.endDate:m, base);
        const rangeStart = mn < today ? mn : today;
        const rangeEnd   = mx > today ? mx : today;
        const s=new Date(rangeStart); s.setDate(s.getDate()-30);
        const e=new Date(rangeEnd);   e.setDate(e.getDate()+14);
        return getDays(toStr(s),toStr(e));
      },[flatRows, today]);

      // Firebase リアルタイムリスナー
      React.useEffect(()=>{
        const setup = () => {
          if(!window._firestore) return;
          const { docRef } = window._firestore;
          const unsub = docRef.onSnapshot(snap => {
            if(!snap.exists) return;
            try {
              const remote = JSON.parse(snap.data().tasks || "[]");
              if(remote.length > 0) {
                setTasksRaw(remote);
                localStorage.setItem(STORAGE_KEY, JSON.stringify(remote));
              }
            } catch {}
          });
          return unsub;
        };
        let unsub;
        if(window._firestore) { unsub = setup(); }
        else { window.addEventListener("firebase-ready", ()=>{ unsub = setup(); }, {once:true}); }
        return ()=>{ if(unsub) unsub(); };
      },[]);

      // ビュー切替・初回のみtodayへスクロール（タスク操作では発火しない）
      const scrollToToday = React.useCallback(()=>{
        if(!ganttRef.current || !allDates.length) return;
        const origin = toStr(allDates[0]);
        const lw = view==="gantt" ? LABEL_W : 0;
        const todayOff = daysBetween(origin, today);
        const scrollTo = lw + todayOff * CELL_W - ganttRef.current.clientWidth / 2 + CELL_W / 2;
        requestAnimationFrame(()=>{ ganttRef.current.scrollLeft = Math.max(0, scrollTo); });
      }, [allDates, view, today]);

      React.useEffect(()=>{ scrollToToday(); },[view]);
      React.useEffect(()=>{ const t=setTimeout(scrollToToday,150); return ()=>clearTimeout(t); },[]);

      // ── Phase 2: allDates・flatRows確定後 ──────────────
      const weekDensity = useMemo(()=>{
        const map = {};
        for(const d of allDates){
          const wk = getWeekKey(d);
          const ds = toStr(d);
          const cnt = flatRows.filter(t=>t.startDate<=ds&&t.endDate>=ds).length;
          map[wk] = (map[wk]||0) + cnt;
        }
        const max = Math.max(...Object.values(map), 1);
        const norm = {};
        for(const k in map) norm[k] = map[k]/max;
        return norm;
      },[allDates, flatRows]);

      const emptyDays = useMemo(()=>{
        const s = new Set();
        for(const d of allDates){
          const ds = toStr(d);
          if(!flatRows.some(t=>t.startDate<=ds&&t.endDate>=ds)) s.add(ds);
        }
        return s;
      },[allDates, flatRows]);

      // 週ごとのタスク件数（重複除外）
      const weekTaskCount = useMemo(()=>{
        const map = {};
        for(const t of flatRows){
          const cur = new Date(t.startDate);
          const end = new Date(t.endDate);
          const seen = new Set();
          while(cur <= end){
            const wk = getWeekKey(cur);
            const key = t.id + wk;
            if(!seen.has(key)){ map[wk]=(map[wk]||0)+1; seen.add(key); }
            cur.setDate(cur.getDate()+1);
          }
        }
        return map;
      },[flatRows]);
      // ────────────────────────────────────────────────────

      // 今日が期間に含まれるタスク
      const todayTasks = useMemo(()=>
        tasks.filter(t=>t.startDate<=today&&t.endDate>=today&&t.status!=="done")
             .sort((a,b)=>{
               // 依存されているものを先に
               const aIsDep = tasks.some(t=>t.deps&&t.deps.includes(a.id));
               const bIsDep = tasks.some(t=>t.deps&&t.deps.includes(b.id));
               return bIsDep - aIsDep;
             })
      ,[tasks,today]);

      // 次の一手: 今日完了できたら開くタスク
      const nextUnlocks = useMemo(()=>{
        const todayIds = new Set(todayTasks.map(t=>t.id));
        const result = [];
        for(const t of tasks){
          if(t.status==="done") continue;
          if(!t.deps||t.deps.length===0) continue;
          const blockedByToday = t.deps.some(d=>todayIds.has(d));
          const allDepsWillDone = t.deps.every(d=>{
            const dep = tasks.find(x=>x.id===d);
            return dep&&(dep.status==="done"||todayIds.has(dep.id));
          });
          if(blockedByToday&&allDepsWillDone) result.push(t);
        }
        return result;
      },[tasks,todayTasks,today]);

      const openNew = (parentId=null) => { setEditId(null); setForm(emptyForm(parentId)); setShowModal(true); };
      const openEdit = task => { setEditId(task.id); setForm({...task, deps:task.deps||[], parentId:task.parentId||null}); setShowModal(true); };
      const save = () => {
        if(!form.name||!form.startDate||!form.endDate) return;
        if(editId) setTasks(ts=>ts.map(t=>t.id===editId?{...form,id:editId}:t));
        else setTasks(ts=>[...ts,{...form,id:Date.now()}]);
        setShowModal(false);
      };
      const remove = id => setTasks(ts=>ts.filter(t=>t.id!==id&&t.parentId!==id));
      const cycleStatus = id => {
        const o = ["todo","inprogress","done"];
        setTasks(ts => {
          const cur = ts.find(t=>t.id===id);
          const nextStatus = o[(o.indexOf(cur.status)+1)%3];
          // 完了になる瞬間だけフラッシュ
          if(nextStatus === "done") {
            setFlashingIds(s => { const n=new Set(s); n.add(id); return n; });
            setTimeout(() => {
              setFlashingIds(s => { const n=new Set(s); n.delete(id); return n; });
              setSinkingIds(s => { const n=new Set(s); n.add(id); return n; });
              setTimeout(() => setSinkingIds(s => { const n=new Set(s); n.delete(id); return n; }), 1900);
            }, 950);
          }
          return ts.map(t=>t.id===id?{...t,status:nextStatus}:t);
        });
      };
      const toggleCollapse = id => setCollapsed(c=>({...c,[id]:!c[id]}));
      const toggleDep = id => setForm(f=>({...f,deps:f.deps.includes(id)?f.deps.filter(d=>d!==id):[...f.deps,id]}));

      const resetData = () => { if(confirm("全タスクをリセットしてサンプルデータに戻しますか？")){ setTasks(INIT); } };

      const renderArrows = (hasLabel) => {
        if(!allDates.length || flatRows.length===0) return null;
        const origin = toStr(allDates[0]);
        const lw = hasLabel ? LABEL_W : 0;
        const arrows = [];
        for(const row of flatRows){
          if(!row.deps?.length) continue;
          const toIdx = flatRows.findIndex(r=>r.id===row.id); if(toIdx<0) continue;
          const toOff = daysBetween(origin, row.startDate);
          const toX = lw + toOff*CELL_W + (row.depth===1?6:3);
          const toY = toIdx*ROW_H + BAR_TOP + (row.depth===1?3:0) + (row.depth===1?BAR_H-6:BAR_H)/2;
          for(const depId of row.deps){
            const depRow = flatRows.find(r=>r.id===depId); if(!depRow) continue;
            const fromIdx = flatRows.findIndex(r=>r.id===depId);
            const depOff = daysBetween(origin, depRow.startDate);
            const depDur = daysBetween(depRow.startDate, depRow.endDate)+1;
            const fromX = lw + (depOff+depDur)*CELL_W - (depRow.depth===1?6:3);
            const fromY = fromIdx*ROW_H + BAR_TOP + (depRow.depth===1?3:0) + (depRow.depth===1?BAR_H-6:BAR_H)/2;
            let path; const clr = depRow.color;
            if(fromX + 6 < toX){ const mx2 = fromX + (toX-fromX)*0.55; path = `M${fromX},${fromY} C${mx2},${fromY} ${mx2},${toY} ${toX},${toY}`; }
            else { const ex = Math.max(fromX+16, toX+24); path = `M${fromX},${fromY} H${ex} V${toY} H${toX}`; }
            const isDone=depRow.status==="done"&&row.status==="done";
            const pathId=`dp-${depId}-${row.id}`;
            const dotDur=4.5+(Number(String(depId).slice(-1))%3)*0.8;
            arrows.push(
              <g key={pathId}>
                <path id={pathId} d={path} stroke={clr} strokeWidth={1.5} fill="none" opacity={isDone?0.2:0.55} strokeDasharray="5 3" strokeLinecap="round" strokeLinejoin="round"/>
                <polygon points={`${toX},${toY} ${toX-9},${toY-4.5} ${toX-9},${toY+4.5}`} fill={clr} opacity={isDone?0.2:0.65}/>
                {!isDone&&[0,0.55].map((offset,di)=>(
                  <circle key={di} r={2} fill={clr} opacity={0.85}>
                    <animateMotion dur={`${dotDur}s`} repeatCount="indefinite" begin={`${-(offset*dotDur).toFixed(2)}s`}><mpath href={`#${pathId}`}/></animateMotion>
                    <animate attributeName="opacity" values="0;0.85;0.85;0" keyTimes="0;0.12;0.82;1" dur={`${dotDur}s`} repeatCount="indefinite" begin={`${-(offset*dotDur).toFixed(2)}s`}/>
                  </circle>
                ))}
              </g>
            );
          }
        }
        return <svg style={{ position:"absolute",top:0,left:0,width:"100%",height:flatRows.length*ROW_H,pointerEvents:"none",overflow:"visible",zIndex:6 }}>{arrows}</svg>;
      };

      return (
        <div className="app-root" style={{ height:"100vh", background:"#0A0A0F", color:"#E2E8F0", fontFamily:"'JetBrains Mono','Fira Code',monospace", display:"flex", flexDirection:"column", overflow:"hidden" }}>
          <style>{`
            .row:hover{background:rgba(255,255,255,0.025)!important}
            .gbar{cursor:pointer;transition:filter 0.15s}.gbar:hover{filter:brightness(1.35)}
            .btn{cursor:pointer;border:none;transition:all 0.18s;font-family:inherit}.btn:hover{opacity:0.82;transform:translateY(-1px)}.btn:active{transform:translateY(0)}
            .vbtn{background:transparent;border:1px solid #2D2D3A;color:#6B7280;padding:5px 13px;border-radius:6px;font-family:inherit;font-size:12px;cursor:pointer;transition:all 0.18s}
            .vbtn.on{background:#1E1E2E;border-color:#4A4A6A;color:#C4B5FD}.vbtn:hover:not(.on){border-color:#4A4A6A;color:#9CA3AF}
            input,select{background:#0D0D14;border:1px solid #2D2D3A;color:#E2E8F0;padding:8px 11px;border-radius:6px;font-family:inherit;font-size:13px;width:100%;outline:none}
            input:focus,select:focus{border-color:#7C3AED;box-shadow:0 0 0 2px rgba(124,58,237,0.15)}
            .del{opacity:0;background:transparent;border:none;color:#EF4444;cursor:pointer;font-size:16px;transition:opacity 0.2s;line-height:1;padding:0}
            .row:hover .del{opacity:1}
            .sbtn{opacity:0;background:transparent;border:1px solid #232334;color:#555577;cursor:pointer;font-size:10px;border-radius:4px;padding:2px 6px;font-family:inherit;transition:all 0.18s;white-space:nowrap}
            .row:hover .sbtn{opacity:1}.sbtn:hover{border-color:#7C3AED;color:#C4B5FD}
            .dep-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:7px;cursor:pointer;border:1px solid transparent;transition:all 0.15s}
            .dep-item:hover{background:#161624;border-color:#2D2D3A}.dep-item.sel{background:#1A1630;border-color:#7C3AED55}
            label{font-size:11px;color:#6B7280;display:block;margin-bottom:4px;letter-spacing:0.07em;text-transform:uppercase}
            .overlay{position:fixed;inset:0;background:rgba(0,0,0,0.75);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;z-index:200}
            .modal{background:#111118;border:1px solid #252535;border-radius:14px;padding:26px;width:460px;max-height:88vh;overflow-y:auto;box-shadow:0 32px 80px rgba(0,0,0,0.7)}
            .save-indicator{font-size:10px;color:#3A5A3A;display:flex;align-items:center;gap:4px}

            /* ── 今日のドロワー ── */
            .drawer { position:fixed; bottom:0; left:0; right:0; z-index:100;
              background:#0D0D18; border-top:1px solid #2A2A4A;
              box-shadow:0 -8px 32px rgba(0,0,0,0.5);
              transition:transform 0.35s cubic-bezier(0.16,1,0.3,1); }
            .drawer.closed { transform:translateY(calc(100% - 38px)); }
            .drawer.open   { transform:translateY(0); }

            /* ── ③ 流れ去り: 完了後にバーが沈む ── */
            @keyframes sinkAway {
              0%   { opacity:1; filter:brightness(1); }
              30%  { opacity:0.6; filter:brightness(0.7) saturate(0.5); }
              100% { opacity:0.38; filter:saturate(0.4) brightness(0.75); }
            }
            .bar-sink { animation:sinkAway 1.8s cubic-bezier(0.4,0,0.2,1) forwards; }
            /* 1日タスクのツールチップ */
            .bar-tooltip { position:fixed; background:#1E1E2E; border:1px solid #3A3A5A; color:#E2E8F0;
              font-size:11px; padding:4px 9px; border-radius:6px; white-space:nowrap; pointer-events:none;
              opacity:0; transition:opacity 0.18s; z-index:9999; box-shadow:0 4px 16px rgba(0,0,0,0.6); }
            .gbar:hover .bar-tooltip { opacity:1; }

            /* ── 起動フェードイン ── */
            @keyframes appFadeIn {
              from { opacity:0; transform:translateY(6px); }
              to   { opacity:1; transform:translateY(0); }
            }
            .app-root { animation: appFadeIn 1.1s cubic-bezier(0.16,1,0.3,1) both; }

            /* ── バーの明暗 ── */
            /* 完了バー: 沈む */
            .bar-done { opacity:0.38; filter:saturate(0.4) brightness(0.75); transition:opacity 1.2s ease, filter 1.2s ease; }
            /* 未来バー（未着手）: 少し沈む */
            .bar-todo  { opacity:0.6; filter:saturate(0.7); }
            /* 進行中バー: 浮かび上がる */
            .bar-inprogress-glow { opacity:1; filter:brightness(1.15) saturate(1.3); }

            /* ── Phase 1 animations ── */

            /* 進行中バー: ゆっくり呼吸する発光 (3.5秒周期) */
            @keyframes breathe {
              0%,100% { box-shadow: 0 0 0px transparent; opacity: 1; }
              50%      { box-shadow: 0 0 8px var(--bar-color, #fff); opacity: 0.82; }
            }
            .bar-inprogress {
              animation: breathe 3.5s ease-in-out infinite;
            }

            /* 完了エフェクト: 一瞬白く光って静まる */
            @keyframes completionFlash {
              0%   { box-shadow: 0 0 0px transparent; filter: brightness(1); }
              15%  { box-shadow: 0 0 18px 4px rgba(255,255,255,0.55); filter: brightness(2.2); }
              40%  { box-shadow: 0 0 10px 2px rgba(255,255,255,0.2); filter: brightness(1.4); }
              100% { box-shadow: 0 0 0px transparent; filter: brightness(1); }
            }
            .bar-done-flash {
              animation: completionFlash 0.9s ease-out forwards;
            }

            /* 今日列: うっすら発光グラデ (縦) */
            .today-col {
              background: linear-gradient(180deg,
                rgba(239,68,68,0.0) 0%,
                rgba(239,68,68,0.055) 40%,
                rgba(239,68,68,0.055) 60%,
                rgba(239,68,68,0.0) 100%
              ) !important;
            }
            /* 今日ヘッダー列 */
            .today-col-header {
              background: linear-gradient(180deg,
                rgba(239,68,68,0.0) 0%,
                rgba(239,68,68,0.08) 100%
              ) !important;
            }
          `}</style>

          {/* Header */}
          <div style={{ padding:"15px 22px", borderBottom:"1px solid #1A1A2E", display:"flex", alignItems:"center", gap:14, background:"#0D0D14", flexShrink:0 }}>
            <div className="header-title" style={{ fontFamily:"'Syne',sans-serif", fontSize:20, fontWeight:800, color:"#C4B5FD", letterSpacing:"-0.02em" }}>⬡ GANTTASK</div>
            <SyncIndicator />
            <div style={{ flex:1 }} />
            <div className="mobile-hide" style={{ display:"flex", gap:5 }}>
              {[["split","⊞ 分割"],["list","≡ リスト"],["gantt","▦ ガント"]].map(([v,l])=>(
                <button key={v} className={`vbtn ${view===v?"on":""}`} onClick={()=>setView(v)}>{l}</button>
              ))}
            </div>
            <button className="btn mobile-hide" onClick={resetData} style={{ background:"transparent", border:"1px solid #2D2D3A", color:"#4A4A6A", padding:"6px 12px", borderRadius:7, fontSize:11 }} title="サンプルデータにリセット">↺</button>
            <button className="btn" onClick={()=>openNew()} style={{ background:"#7C3AED", color:"white", padding:"7px 16px", borderRadius:7, fontSize:13, fontWeight:600 }}>+ タスク追加</button>
          </div>

          {/* Filter Bar */}
          <div style={{ padding:"9px 22px", borderBottom:"1px solid #1A1A2E", display:"flex", gap:6, alignItems:"center", flexShrink:0 }}>
            <button className="btn" onClick={()=>setFilters(new Set())} style={{
              background: filters.size===0?"#1E1E2E":"transparent",
              border:`1px solid ${filters.size===0?"#4A4A6A":"#1A1A2E"}`,
              color: filters.size===0?"#E2E8F0":"#6B7280",
              padding:"4px 12px", borderRadius:20, fontSize:11
            }}>全て ({tasks.length})</button>

            <div style={{ width:1, height:18, background:"#1A1A2E", margin:"0 2px" }}/>

            {Object.entries(STATUS_CFG).map(([k,c])=>{
              const active = filters.has(k);
              const count = tasks.filter(t=>t.status===k).length;
              return (
                <button key={k} className="btn" onClick={()=>{ setFilters(prev=>{ const next=new Set(prev); next.has(k)?next.delete(k):next.add(k); return next; }); }} style={{
                  background: active?`${c.color}18`:"transparent",
                  border: `1px solid ${active?c.color+"66":"#1A1A2E"}`,
                  color: active?c.color:"#6B7280",
                  padding:"4px 12px", borderRadius:20, fontSize:11,
                  display:"flex", alignItems:"center", gap:5
                }}>
                  <span style={{ width:6, height:6, borderRadius:"50%", background:active?c.color:"#3A3A5A", display:"inline-block", flexShrink:0, transition:"background 0.2s" }}/>
                  {c.label}
                  <span style={{ background:active?`${c.color}33`:"#1A1A2E", color:active?c.color:"#4A4A6A", borderRadius:10, padding:"0 5px", fontSize:10, fontWeight:600, minWidth:18, textAlign:"center" }}>{count}</span>
                </button>
              );
            })}

            <div style={{ flex:1 }} />

            {filters.size > 0 && (
              <div style={{ display:"flex", alignItems:"center", gap:6, fontSize:10, color:"#6B7280" }}>
                <span style={{ color:"#3A3A5A" }}>フィルター:</span>
                {[...filters].map(k=>(
                  <span key={k} style={{ background:`${STATUS_CFG[k].color}22`, color:STATUS_CFG[k].color, border:`1px solid ${STATUS_CFG[k].color}44`, borderRadius:10, padding:"1px 8px", display:"flex", alignItems:"center", gap:4 }}>
                    {STATUS_CFG[k].label}
                    <span onClick={()=>setFilters(p=>{const n=new Set(p);n.delete(k);return n;})} style={{ cursor:"pointer", opacity:0.7, fontWeight:700 }}>×</span>
                  </span>
                ))}
              </div>
            )}
            <div style={{ width:1, height:18, background:"#1A1A2E", margin:"0 8px" }}/>
        <button
          className="btn"
          onClick={scrollToToday}
          title="今日の日付へスクロール"
          style={{
            background:"transparent", border:"1px solid #3A3A5A", color:"#EF4444",
            padding:"4px 12px", borderRadius:20, fontSize:11, display:"flex", alignItems:"center", gap:5
          }}
        >
          <span style={{ width:6, height:6, borderRadius:"50%", background:"#EF4444", display:"inline-block" }}/>
          TODAY
        </button>
        <span style={{ fontSize:10, color:"#2D2D4A", marginLeft:4 }}>{fmtDate(today)}</span>
          </div>

          {/* Body */}
          <div style={{ flex:1, display:"flex", overflow:"hidden" }}>

            {/* List */}
            {(view==="split"||view==="list") && (
              <div ref={listRef} onScroll={onListScroll} style={{ width:view==="split"?360:"100%", borderRight:"1px solid #1A1A2E", overflowY:"auto", flexShrink:0 }}>
                <table style={{ width:"100%", borderCollapse:"collapse" }}>
                  <thead>
                    <tr style={{ background:"#0D0D14", position:"sticky", top:0, zIndex:10 }}>
                      {["タスク名","期間","担当","状態",""].map((h,i)=>(
                        <th key={i} style={{ padding:"9px 11px", textAlign:"left", fontSize:10, color:"#3A3A5A", fontWeight:500, letterSpacing:"0.06em", borderBottom:"1px solid #1A1A2E", whiteSpace:"nowrap" }}>{h}</th>
                      ))}
                    </tr>
                  </thead>
                  <tbody>
                    {flatRows.map(task=>(
                      <tr key={task.id} className="row" style={{ borderBottom:"1px solid #0D0D18", height:ROW_H }}>
                        <td style={{ padding:"0 11px", paddingLeft:task.depth===1?24:11 }}>
                          <div style={{ display:"flex", alignItems:"center", gap:5 }}>
                            {task.hasChildren
                              ? <button onClick={()=>toggleCollapse(task.id)} style={{ background:"transparent", border:"none", color:"#555577", cursor:"pointer", width:14, fontSize:10, padding:0, flexShrink:0 }}>{collapsed[task.id]?"▶":"▼"}</button>
                              : <div style={{ width:14, flexShrink:0, textAlign:"center" }}>{task.depth===1&&<span style={{ color:"#2D2D4A", fontSize:12 }}>└</span>}</div>
                            }
                            <div style={{ width:3, height:task.depth===1?13:16, background:task.color, borderRadius:2, flexShrink:0, opacity:task.depth===1?0.7:1 }}/>
                            <span onClick={()=>openEdit(task)} style={{ fontSize:task.depth===1?11:12, fontWeight:500, color:task.status==="done"?"#4B5563":"#E2E8F0", textDecoration:task.status==="done"?"line-through":"none", cursor:"pointer", flex:1 }}>
                              {task.name}
                            </span>
                            {task.depth===0 && <button className="sbtn" onClick={e=>{e.stopPropagation();openNew(task.id);}}>+ sub</button>}
                          </div>
                        </td>
                        <td style={{ padding:"0 11px", fontSize:10, color:"#6B7280", whiteSpace:"nowrap" }}>{fmtDate(task.startDate)}–{fmtDate(task.endDate)}</td>
                        <td style={{ padding:"0 11px", fontSize:11, color:"#9CA3AF" }}>{task.assignee||"—"}</td>
                        <td style={{ padding:"0 11px" }} onClick={e=>{e.stopPropagation();cycleStatus(task.id);}}>
                          <span style={{ background:STATUS_CFG[task.status].bg, color:STATUS_CFG[task.status].color, border:`1px solid ${STATUS_CFG[task.status].color}44`, padding:"3px 7px", borderRadius:4, fontSize:10, cursor:"pointer", whiteSpace:"nowrap" }}>
                            {STATUS_CFG[task.status].label}
                          </span>
                        </td>
                        <td style={{ padding:"0 8px" }}><button className="del" onClick={()=>remove(task.id)}>×</button></td>
                      </tr>
                    ))}
                    {flatRows.length===0&&<tr><td colSpan={5} style={{ padding:36, textAlign:"center", color:"#2D2D3A", fontSize:12 }}>タスクがありません</td></tr>}
                  </tbody>
                </table>
              </div>
            )}

            {/* Gantt */}
            {(view==="split"||view==="gantt") && allDates.length>0 && (
              <div ref={ganttRef} onScroll={onGanttScroll} style={{ flex:1, overflow:"auto" }}>
                <div style={{ minWidth:(view==="gantt"?LABEL_W:0)+allDates.length*CELL_W }}>
                  {/* Week busyness bar */}
                  <div style={{ display:"flex", background:"#080810", position:"sticky", top:0, zIndex:11, borderBottom:"1px solid #111120" }}>
                    {view==="gantt"&&<div style={{ width:LABEL_W, flexShrink:0, borderRight:"1px solid #1A1A2E", padding:"3px 14px", fontSize:9, color:"#3A3A5A", display:"flex", alignItems:"center" }}>週の忙しさ</div>}
                    <div style={{ display:"flex", flex:1, overflow:"hidden" }}>
                      {(()=>{
                        const weeks=[];
                        let wKey=null, wCount=0;
                        for(let i=0;i<allDates.length;i++){
                          const k=getWeekKey(allDates[i]);
                          if(k!==wKey){ if(wKey!==null)weeks.push({key:wKey,days:wCount,count:weekTaskCount[wKey]||0}); wKey=k; wCount=1; }
                          else wCount++;
                        }
                        if(wKey!==null)weeks.push({key:wKey,days:wCount,count:weekTaskCount[wKey]||0});
                        const maxC=Math.max(...weeks.map(w=>w.count),1);
                        const col=r=>r===0?"#1A1A2E":r<0.35?"#4ECDC4":r<0.65?"#F59E0B":"#FF6B6B";
                        return weeks.map(w=>{
                          const r=w.count/maxC;
                          const c=col(r);
                          return (
                            <div key={w.key} style={{ width:w.days*CELL_W, flexShrink:0, height:18, position:"relative", borderRight:"1px solid #111120", overflow:"hidden" }}>
                              <div style={{ position:"absolute", left:0, top:0, bottom:0, width:`${r*100}%`, background:c, opacity:0.28 }}/>
                              {w.count>0&&w.days*CELL_W>30&&(
                                <div style={{ position:"absolute", inset:0, display:"flex", alignItems:"center", justifyContent:"center", fontSize:9, color:c, fontWeight:700, opacity:0.95 }}>{w.count}件</div>
                              )}
                            </div>
                          );
                        });
                      })()}
                    </div>
                  </div>

                  <div style={{ display:"flex", background:"#0D0D14", position:"sticky", top:18, zIndex:10, borderBottom:"1px solid #1A1A2E" }}>
                    {view==="gantt"&&<div style={{ width:LABEL_W, flexShrink:0, padding:"9px 14px", fontSize:10, color:"#3A3A5A", borderRight:"1px solid #1A1A2E" }}>タスク名</div>}
                    <div style={{ display:"flex" }}>
                      {allDates.map((d,i)=>{
                        const isToday=toStr(d)===today, isWE=d.getDay()===0||d.getDay()===6;
                        const wk = getWeekKey(d);
                        const density = weekDensity[wk]||0;
                        // 密度が高いほど白みがかって浮き上がる (max 10% white overlay)
                        const densityBg = density>0 ? `rgba(255,255,255,${(density*0.08).toFixed(3)})` : "transparent";
                        return (
                          <div key={i} className={isToday?"today-col-header":""} style={{ width:CELL_W, flexShrink:0, textAlign:"center", padding:"7px 0 5px", fontSize:10,
                            color:isToday?"#EF4444":isWE?"#3A3A5A":"#4A5568",
                            background:isToday?"transparent":isWE?"rgba(255,255,255,0.01)":densityBg,
                            borderRight:"1px solid #0D0D14", position:"relative", fontWeight:isToday?700:400 }}>
                            {(d.getDate()===1||i===0)&&<div style={{ fontSize:9, color:"#2D2D3A", marginBottom:1 }}>{d.getMonth()+1}月</div>}
                            <div>{d.getDate()}</div>
                            {isToday&&<div style={{ position:"absolute", bottom:0, left:"50%", transform:"translateX(-50%)", width:3, height:3, background:"#EF4444", borderRadius:"50%" }}/>}
                          </div>
                        );
                      })}
                    </div>
                  </div>

                  <div style={{ position:"relative" }}>
                    {flatRows.map((task,ri)=>{
                      const origin=toStr(allDates[0]);
                      const sOff=daysBetween(origin,task.startDate);
                      const dur=daysBetween(task.startDate,task.endDate)+1;
                      const prog=task.status==="done"?100:task.status==="inprogress"?55:0;
                      const sub=task.depth===1;
                      const lw=view==="gantt"?LABEL_W:0;
                      const w=task.weight||3;
                      const barHBase=sub?BAR_H-8:BAR_H;
                      const barH=Math.round(barHBase*[0.45,0.7,1.0,1.3,1.6][w-1]);
                      const barLeft=lw+sOff*CELL_W+(sub?6:3);
                      const barTop=ri*ROW_H+Math.round((ROW_H-barH)/2);
                      const barW=Math.max(dur*CELL_W-(sub?12:6),sub?8:Math.max(dur*CELL_W-6,8));
                      return (
                        <div key={task.id} style={{ display:"flex", borderBottom:"1px solid #0D0D14", height:ROW_H, background:ri%2===0?"transparent":"rgba(255,255,255,0.007)" }}>
                          {view==="gantt"&&(
                            <div style={{ width:LABEL_W, flexShrink:0, padding:"0 11px", display:"flex", alignItems:"center", gap:4, borderRight:"1px solid #1A1A2E", paddingLeft:sub?18:6 }}>
                              {sub&&<span style={{ color:"#2D2D4A", fontSize:12, flexShrink:0 }}>└</span>}
                              <div style={{ width:3, height:sub?13:16, background:task.color, borderRadius:2, flexShrink:0, opacity:sub?0.7:1 }}/>
                              <span onClick={()=>openEdit(task)} style={{ fontSize:sub?9:10, color:task.status==="done"?"#4B5563":"#D1D5DB", overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap", flex:1, cursor:"pointer" }}>{task.name}</span>
                            </div>
                          )}
                          <div style={{ display:"flex", flex:1 }}>
                            {allDates.map((d,i)=>{
                              const isWE=d.getDay()===0||d.getDay()===6, isT=toStr(d)===today;
                              const ds2=toStr(d);
                              const isEmpty=emptyDays.has(ds2);
                              const wk2=getWeekKey(d);
                              const dens2=weekDensity[wk2]||0;
                              // 余白日: うっすら明るい / 密度: ヘッダーより控えめに反映
                              const cellBg = isT?"transparent"
                                : isEmpty ? "rgba(255,255,255,0.032)"
                                : isWE ? "rgba(255,255,255,0.008)"
                                : dens2>0 ? `rgba(255,255,255,${(dens2*0.04).toFixed(3)})`
                                : "transparent";
                              return <div key={i} className={isT?"today-col":""} style={{ width:CELL_W, height:ROW_H, flexShrink:0, background:cellBg, borderRight:"1px solid #0D0D14" }}/>;
                            })}
                          </div>
                          <div
                            className={[
                              "gbar",
                              task.status==="inprogress" ? "bar-inprogress bar-inprogress-glow" : "",
                              task.status==="done" && !flashingIds.has(task.id) && !sinkingIds.has(task.id) ? "bar-done" : "",
                              task.status==="todo" ? "bar-todo" : "",
                              flashingIds.has(task.id) ? "bar-done-flash" : "",
                              sinkingIds.has(task.id) ? "bar-sink" : "",
                            ].join(" ")}
                            style={{
                              "--bar-color": task.color,
                              position:"absolute", left:barLeft, top:barTop, width:barW, height:barH,
                              background:`${task.color}1C`, border:`${sub?"1px":"1.5px"} solid ${task.color}${sub?"55":"88"}`,
                              borderRadius:sub?4:6, overflow:"hidden", zIndex:3
                            }}
                            onClick={()=>openEdit(task)}
                          >
                            <div style={{ height:"100%", width:`${prog}%`, background:`${task.color}44`, borderRadius:4 }}/>
                            <span style={{ position:"absolute", inset:0, display:"flex", alignItems:"center", paddingLeft:6, fontSize:10, color:task.color, fontWeight:600, whiteSpace:"nowrap", overflow:"hidden" }}>
                              {dur*CELL_W>65?task.name:""}
                            </span>
                          </div>
                          {/* バーが狭い場合: overflow:hiddenの外にラベルを配置 */}
                          {dur*CELL_W<=65 && (
                            <div style={{
                              position:"absolute",
                              left: barLeft + barW + 5,
                              top: barTop,
                              height: barH,
                              display:"flex", alignItems:"center",
                              fontSize:10, color:task.color, fontWeight:600,
                              whiteSpace:"nowrap", pointerEvents:"none",
                              opacity:0.9, textShadow:"0 1px 6px rgba(0,0,0,0.9)",
                              zIndex:4
                            }}>
                              {task.name}
                            </div>
                          )}
                        </div>
                      );
                    })}
                    {renderArrows(view==="gantt")}
                  </div>
                </div>
              </div>
            )}
          </div>

          {/* ② 今日のタスク ドロワー */}
          <div className={`drawer ${drawerOpen?"open":"closed"}`}>
            {/* ハンドル */}
            <div
              onClick={()=>setDrawerOpen(o=>!o)}
              style={{ height:38, display:"flex", alignItems:"center", justifyContent:"space-between",
                padding:"0 22px", cursor:"pointer", userSelect:"none" }}
            >
              <div style={{ display:"flex", alignItems:"center", gap:10 }}>
                <span style={{ fontSize:11, color:"#EF4444", fontWeight:700, letterSpacing:"0.08em" }}>
                  ● 今日のタスク
                </span>
                <span style={{ background:"#EF4444", color:"white", borderRadius:10, fontSize:10, fontWeight:700, padding:"1px 7px" }}>
                  {todayTasks.length}
                </span>
                {nextUnlocks.length>0&&(
                  <span style={{ fontSize:10, color:"#F59E0B", opacity:0.8 }}>
                    → 完了で{nextUnlocks.length}件が動き出す
                  </span>
                )}
              </div>
              <span style={{ fontSize:12, color:"#4A4A6A" }}>{drawerOpen?"▼":"▲"}</span>
            </div>

            {/* コンテンツ */}
            <div style={{ padding:"0 22px 16px", display:"flex", gap:24, overflowX:"auto" }}>
              {/* 今日のタスクリスト */}
              <div style={{ flex:1, minWidth:280 }}>
                <div style={{ fontSize:10, color:"#4A4A6A", marginBottom:8, letterSpacing:"0.06em" }}>やること</div>
                {todayTasks.length===0
                  ? <div style={{ fontSize:12, color:"#3A3A5A", padding:"8px 0" }}>今日のタスクはありません</div>
                  : todayTasks.map(t=>(
                    <div key={t.id} style={{ display:"flex", alignItems:"center", gap:10, padding:"7px 0", borderBottom:"1px solid #1A1A2E" }}>
                      <div style={{ width:3, height:16, background:t.color, borderRadius:2, flexShrink:0 }}/>
                      <span style={{ fontSize:12, flex:1, color:"#E2E8F0" }}>{t.name}</span>
                      {t.parentId&&(
                        <span style={{ fontSize:10, color:"#4A4A6A" }}>
                          {tasks.find(p=>p.id===t.parentId)?.name}
                        </span>
                      )}
                      <span
                        onClick={()=>cycleStatus(t.id)}
                        style={{ background:STATUS_CFG[t.status].bg, color:STATUS_CFG[t.status].color,
                          border:`1px solid ${STATUS_CFG[t.status].color}44`,
                          padding:"2px 8px", borderRadius:4, fontSize:10, cursor:"pointer", whiteSpace:"nowrap" }}
                      >
                        {STATUS_CFG[t.status].label}
                      </span>
                    </div>
                  ))
                }
              </div>

              {/* 次の一手 */}
              {nextUnlocks.length>0&&(
                <div style={{ minWidth:220 }}>
                  <div style={{ fontSize:10, color:"#F59E0B", marginBottom:8, letterSpacing:"0.06em" }}>今日終えると開く</div>
                  {nextUnlocks.map(t=>(
                    <div key={t.id} style={{ display:"flex", alignItems:"center", gap:8, padding:"7px 0", borderBottom:"1px solid #1A1A2E" }}>
                      <div style={{ width:3, height:14, background:t.color, borderRadius:2, flexShrink:0 }}/>
                      <span style={{ fontSize:11, color:"#9CA3AF", flex:1 }}>{t.name}</span>
                      <span style={{ fontSize:10, color:"#4A4A6A" }}>{t.startDate}</span>
                    </div>
                  ))}
                </div>
              )}
            </div>
          </div>

          {/* Stats */}
          <div style={{ padding:"9px 22px", borderTop:"1px solid #1A1A2E", background:"#0D0D14", display:"flex", gap:18, fontSize:11, flexShrink:0, alignItems:"center" }}>
            {Object.entries(STATUS_CFG).map(([k,c])=>(
              <div key={k} style={{ display:"flex", alignItems:"center", gap:5 }}>
                <div style={{ width:7, height:7, borderRadius:"50%", background:c.color }}/>
                <span style={{ color:"#4B5563" }}>{c.label}:</span>
                <span style={{ color:c.color, fontWeight:600 }}>{tasks.filter(t=>t.status===k).length}</span>
              </div>
            ))}
            <div style={{ flex:1 }}/>
            <span style={{ color:"#3A3A5A" }}>{tasks.filter(t=>!t.parentId).length} tasks · {tasks.filter(t=>t.parentId).length} subtasks</span>
          </div>

          {/* Modal */}
          {showModal&&(
            <div className="overlay" onClick={()=>setShowModal(false)}>
              <div className="modal" onClick={e=>e.stopPropagation()}>
                <div style={{ fontFamily:"'Syne',sans-serif", fontSize:17, fontWeight:700, marginBottom:20, color:"#E2E8F0" }}>
                  {editId?"✎ タスクを編集":form.parentId?"+ サブタスクを追加":"+ 新しいタスク"}
                </div>
                {form.parentId&&(
                  <div style={{ marginBottom:14, padding:"8px 12px", background:"#16162A", borderRadius:8, border:"1px solid #2D2D4A", fontSize:11, color:"#8B8BCC" }}>
                    親タスク: {tasks.find(t=>t.id===form.parentId)?.name}
                  </div>
                )}
                <div style={{ display:"flex", flexDirection:"column", gap:14 }}>
                  <div>
                    <label>タスク名</label>
                    <input value={form.name} onChange={e=>setForm(f=>({...f,name:e.target.value}))} placeholder="タスク名を入力..." autoFocus/>
                  </div>
                  <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10 }}>
                    <div><label>開始日</label><input type="date" value={form.startDate} onChange={e=>setForm(f=>({...f,startDate:e.target.value}))}/></div>
                    <div><label>終了日</label><input type="date" value={form.endDate} onChange={e=>setForm(f=>({...f,endDate:e.target.value}))}/></div>
                  </div>
                  <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10 }}>
                    <div>
                      <label>ステータス</label>
                      <select value={form.status} onChange={e=>setForm(f=>({...f,status:e.target.value}))}>
                        <option value="todo">未着手</option><option value="inprogress">進行中</option><option value="done">完了</option>
                      </select>
                    </div>
                    <div><label>担当者</label><input value={form.assignee} onChange={e=>setForm(f=>({...f,assignee:e.target.value}))} placeholder="担当者名..."/></div>
                  </div>
                  {!form.parentId&&(
                    <div>
                      <label>親タスク（サブタスクにする場合）</label>
                      <select value={""} onChange={e=>e.target.value&&setForm(f=>({...f,parentId:Number(e.target.value)}))}>
                        <option value="">なし（トップレベル）</option>
                        {tasks.filter(t=>!t.parentId&&t.id!==editId).map(t=><option key={t.id} value={t.id}>{t.name}</option>)}
                      </select>
                    </div>
                  )}
                  <div>
                    <label>先行タスク（完了後に開始）</label>
                    <div style={{ border:"1px solid #252535", borderRadius:8, maxHeight:155, overflowY:"auto", padding:5 }}>
                      {(()=>{
                          const depCandidates = tasks.filter(t =>
                            t.id !== editId &&
                            t.id !== form.parentId &&
                            t.status !== "done" &&
                            // サブタスク編集時は同じ親タスクのものだけ
                            (form.parentId ? t.parentId === form.parentId : true)
                          );
                          return depCandidates.length===0
                            ?<div style={{ padding:"8px 10px", fontSize:12, color:"#3A3A5A" }}>選択可能なタスクがありません</div>
                            :depCandidates.map(t=>{
                          const sel=form.deps.includes(t.id);
                          return (
                            <div key={t.id} className={`dep-item ${sel?"sel":""}`} onClick={()=>toggleDep(t.id)}>
                              <div style={{ width:3, height:14, background:t.color, borderRadius:2, flexShrink:0 }}/>
                              <span style={{ fontSize:12, flex:1, color:sel?"#C4B5FD":"#9CA3AF" }}>
                                {t.parentId?`  └ ${t.name}`:t.name}
                              </span>
                              <div style={{ width:16, height:16, borderRadius:4, border:`1.5px solid ${sel?"#7C3AED":"#2D2D3A"}`, background:sel?"#7C3AED":"transparent", display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0 }}>
                                {sel&&<span style={{ color:"white", fontSize:10, fontWeight:700, lineHeight:1 }}>✓</span>}
                              </div>
                            </div>
                          );
                        });
                        })()}
                    </div>
                    {form.deps.length>0&&<div style={{ marginTop:4, fontSize:10, color:"#6B7280" }}>{form.deps.length}件の先行タスクを選択中</div>}
                  </div>
                  <div>
                    <label>重さ（バーの太さ）</label>
                    <div style={{ display:"flex", alignItems:"center", gap:10 }}>
                      <input type="range" min="1" max="5" step="1" value={form.weight||3} onChange={e=>setForm(f=>({...f,weight:Number(e.target.value)}))} style={{ flex:1, accentColor:"#7C3AED", padding:0 }}/>
                      <div style={{ display:"flex", gap:3, alignItems:"flex-end" }}>
                        {[1,2,3,4,5].map(n=>(<div key={n} style={{ width:8, borderRadius:2, height:6+n*4, background:n<=(form.weight||3)?"#7C3AED":"#2D2D3A" }}/>))}
                      </div>
                      <span style={{ fontSize:11, color:"#9CA3AF", width:16 }}>{form.weight||3}</span>
                    </div>
                  </div>
              <div>
                    <label>カラー</label>
                    <div style={{ display:"flex", gap:7, flexWrap:"wrap" }}>
                      {COLORS.map(c=>(
                        <div key={c} onClick={()=>setForm(f=>({...f,color:c}))} style={{ width:26, height:26, borderRadius:"50%", background:c, cursor:"pointer", border:form.color===c?"3px solid white":"3px solid transparent", boxShadow:form.color===c?`0 0 0 2px ${c}`:"none", transition:"all 0.14s" }}/>
                      ))}
                    </div>
                  </div>
                  <div style={{ display:"flex", gap:9, marginTop:4 }}>
                    <button className="btn" onClick={()=>setShowModal(false)} style={{ flex:1, background:"transparent", border:"1px solid #2D2D3A", color:"#6B7280", padding:"9px", borderRadius:8, fontSize:13 }}>キャンセル</button>
                    <button className="btn" onClick={save} style={{ flex:2, background:"#7C3AED", color:"white", padding:"9px", borderRadius:8, fontSize:13, fontWeight:600 }}>{editId?"更新する":"追加する"}</button>
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
